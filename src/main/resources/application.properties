server.port=8081
spring.application.name=enterprise-railway-ai-client

spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=railway-mcp-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.railway-server.url=http://localhost:8080
spring.ai.mcp.client.streamable-http.connections.railway-server.endpoint=/mcp